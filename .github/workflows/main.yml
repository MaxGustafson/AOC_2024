on: [push]

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - uses: actions/checkout@v6
      - id: foo
        uses: MaxGustafson/hello-world-composite-action@9cb89489131a02ad0b874f91526aaee8910fc647
        with:
          who-to-greet: 'Max the mountain scaler'
      - run: echo random-number "$RANDOM_NUMBER"
        shell: bash
        env:
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}

